[project]
name = "math-ai-matrix-labs"
version = "0.1.0"
description = "Hands-on labs for the math-ai-matrix learning tracks (NumPy first, then PyTorch)."
requires-python = "==3.12.*"
dependencies = [
    "numpy==2.3.3",
    "torch==2.8.0",
    "pytest==8.4.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["llm"]
